<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f17" />
    <title>NikitenokArena</title>
    <!-- Заставка рисуется сразу, пока грузится игра (~400 КБ скриптов; 3D, камера и тяжёлые экраны докачиваются потом). Всё встроено, без внешних файлов. -->
    <style>
      html, body { margin: 0; background: #0d0f17; }
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; overflow: hidden; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at 50% 40%, #2c3a6e 0, #141a33 50%, #0a0d1f 100%); transition: opacity .45s ease, transform .45s ease; }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .rays { position: absolute; left: 50%; top: 40%; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: repeating-conic-gradient(from 0deg, rgba(255, 180, 107, .07) 0 8deg, transparent 8deg 22deg); border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 0, transparent 65%); mask: radial-gradient(circle, #000 0, transparent 65%); animation: sp-spin 28s linear infinite; }
      #splash .logo { position: relative; width: 168px; height: 168px; animation: sp-float 3.2s ease-in-out infinite; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .55)) drop-shadow(0 0 40px rgba(255, 140, 90, .35)); }
      #splash .logo svg { width: 100%; height: 100%; display: block; }
      #splash .shine { position: absolute; inset: 0; clip-path: path('M84 6 L156 31 C156 99 131 149 84 162 C37 149 12 99 12 31 Z'); overflow: hidden; }
      #splash .shine::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-18deg); animation: sp-shine 2.6s ease-in-out infinite 0.6s; }
      #splash .sword { transform-origin: 84px 88px; animation: sp-swing 2.6s ease-in-out infinite; }
      #splash .bell { transform-origin: 84px 88px; animation: sp-lift 2.6s ease-in-out infinite; }
      #splash .name { font-weight: 900; font-size: 26px; letter-spacing: 6px; background: linear-gradient(90deg, #ffd7a3, #ff9a62, #ffd7a3); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sp-grad 3s linear infinite; }
      #splash .tip { height: 20px; font-size: 15px; font-weight: 600; color: #b9c1dd; text-align: center; padding: 0 24px; transition: opacity .3s; }
      #splash .bar { width: min(260px, 70vw); height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .4); }
      #splash .bar i { display: block; height: 100%; width: 4%; border-radius: inherit; background: linear-gradient(90deg, #ffb46b, #ff7a59); box-shadow: 0 0 12px rgba(255, 122, 89, .7); transition: width .35s ease; }
      #splash .reps { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); font-size: 12px; color: #6f789a; letter-spacing: 1px; }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-float { 50% { transform: translateY(-8px); } }
      @keyframes sp-shine { 0% { left: -60%; } 60%, 100% { left: 130%; } }
      @keyframes sp-swing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-7deg); } }
      @keyframes sp-lift { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg) translateY(-3px); } }
      @keyframes sp-grad { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Загрузка">
      <div class="rays"></div>
      <div class="logo">
        <svg viewBox="0 0 168 168" aria-hidden="true">
          <defs>
            <linearGradient id="sp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd7a3" /><stop offset=".5" stop-color="#ff9a62" /><stop offset="1" stop-color="#e8613f" /></linearGradient>
            <linearGradient id="sp-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26305e" /><stop offset="1" stop-color="#151a38" /></linearGradient>
            <linearGradient id="sp-steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f6fb" /><stop offset=".5" stop-color="#c3cbe0" /><stop offset="1" stop-color="#8f9ab8" /></linearGradient>
          </defs>
          <path d="M84 6 L156 31 C156 99 131 149 84 162 C37 149 12 99 12 31 Z" fill="url(#sp-g)" />
          <path d="M84 20 L144 41 C143 99 122 138 84 149 C46 138 25 99 24 41 Z" fill="url(#sp-in)" />
          <g class="sword"><g transform="translate(84 88) rotate(-42) scale(.36)">
            <path d="M-22 -150 L0 -200 L22 -150 L22 70 L-22 70 Z" fill="url(#sp-steel)" />
            <path d="M0 -190 L0 66" stroke="#8f9ab8" stroke-width="5" />
            <rect x="-66" y="66" width="132" height="26" rx="12" fill="url(#sp-g)" />
            <rect x="-13" y="92" width="26" height="62" rx="8" fill="#7a3f27" />
            <circle cx="0" cy="166" r="20" fill="url(#sp-g)" />
          </g></g>
          <g class="bell"><g transform="translate(84 88) rotate(42) scale(.36)">
            <rect x="-12" y="-120" width="24" height="240" rx="10" fill="url(#sp-steel)" />
            <rect x="-52" y="-170" width="104" height="40" rx="14" fill="url(#sp-g)" />
            <rect x="-62" y="-132" width="124" height="34" rx="14" fill="#e8613f" />
            <rect x="-62" y="98" width="124" height="34" rx="14" fill="#e8613f" />
            <rect x="-52" y="130" width="104" height="40" rx="14" fill="url(#sp-g)" />
          </g></g>
        </svg>
        <div class="shine"></div>
      </div>
      <div class="name">NIKITENOK ARENA</div>
      <div class="bar"><i></i></div>
      <div class="tip">Разминаемся перед боем…</div>
      <div class="reps">КАЖДЫЙ ПОВТОР — УДАР ПО ВРАГУ</div>
    </div>
    <script>
      // Полоска ползёт сама и замедляется к концу; игра дотягивает её до 100% и убирает заставку (src/main.tsx).
      (function () {
        var s = document.getElementById('splash');
        var bar = s.querySelector('.bar i');
        var tip = s.querySelector('.tip');
        var tips = ['Разминаемся перед боем…', 'Будим Мастера Грома…', 'Князь Диван зевает и не ждёт подвоха…', 'Точим мечи и подкачиваем гантели…', 'Расставляем боссов по карте…', 'Камера учится считать повторы…'];
        var p = 4, t = 0, k = 0;
        var timer = setInterval(function () {
          p += (92 - p) * 0.06;
          bar.style.width = p.toFixed(1) + '%';
          if (++t % 12 === 0) {
            tip.style.opacity = 0;
            setTimeout(function () { tip.textContent = tips[++k % tips.length]; tip.style.opacity = 1; }, 300);
          }
        }, 150);
        window.__splashDone = function () {
          clearInterval(timer);
          bar.style.width = '100%';
          setTimeout(function () { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 500); }, 250);
        };
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Сразу сообщаем Telegram, что страница готова: он убирает свой чёрный экран и показывает заставку.
      try {
        var w = window.Telegram && window.Telegram.WebApp;
        if (w) { w.ready(); w.expand(); w.setHeaderColor && w.setHeaderColor('#0d0f17'); w.setBackgroundColor && w.setBackgroundColor('#0d0f17'); }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
