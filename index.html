  <body>

    <script>
      // Заставка с настоящим прогрессом. Сборка вписывает сюда файлы первого экрана с весом в байтах
      // (vite.config.ts, splash-files): полоска растёт, когда браузер их докачал (Resource Timing).
      // Дальше шаги игры (src/main.tsx → __splashStep): шрифт и мессенджер, первый кадр — __splashDone.
      // Без списка (режим разработки, старый браузер) полоска ползёт сама и замедляется к концу.
      (function () {
        var FILES = /*SPLASH_FILES*/[];
        var s = document.getElementById('splash');
        var fill = s.querySelector('.fill'), spark = s.querySelector('.spark'), pctEl = s.querySelector('.pct span');
        var stageEl = s.querySelector('.what b'), sizeEl = s.querySelector('.what small'), tip = s.querySelector('.tip'), stepsEl = s.querySelector('.steps');
        var en = false;
        var TXT = {
          ru: { motto: 'Каждый повтор — удар по врагу', steps: ['Герои', 'Мир', 'Вход', 'Арена'], stages: ['Герои собираются', 'Строим мир', 'Входим в игру', 'Открываем арену', 'В бой!'], of: 'из', mb: 'МБ', kb: 'КБ',
            tips: ['Разминаемся перед боем…', 'Будим Мастера Грома…', 'Князь Диван зевает и не ждёт подвоха…', 'Точим мечи и подкачиваем гантели…', 'Расставляем боссов по карте…', 'Камера учится считать повторы…', 'Бабушка Марфа печёт пирожки для героев…', 'Лиса прячет сундук получше…'] },
          en: { motto: 'Every rep is a strike', steps: ['Heroes', 'World', 'Sign-in', 'Arena'], stages: ['Heroes are gathering', 'Building the world', 'Signing in', 'Opening the arena', 'Fight!'], of: 'of', mb: 'MB', kb: 'KB',
            tips: ['Warming up before the fight…', 'Waking up Master Grom…', 'Prince Couch yawns, suspecting nothing…', 'Sharpening swords, pumping dumbbells…', 'Placing bosses on the map…', 'The camera is learning to count reps…'] },
        };
        function detectLang() {
          try { var v = localStorage.getItem('fit-arena-lang'); if (v === 'ru' || v === 'en') return v === 'en'; } catch (e) {}
          var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
          var code = (tg && tg.language_code) || navigator.language || 'ru';
          return !/^(ru|uk|be|kk|ky|uz|tg|tk|az|hy|ka|mo|ro)/i.test(code);
        }
        var L;
        var step = 0, stepEls = [];
        function localize() {
          en = detectLang();
          L = en ? TXT.en : TXT.ru;
          s.querySelector('[data-t=motto]').textContent = L.motto;
          s.setAttribute('aria-label', en ? 'Loading' : 'Загрузка');
          stepsEl.textContent = '';
          stepEls = L.steps.map(function (name) { var d = document.createElement('div'); d.className = 'step'; d.textContent = name; stepsEl.appendChild(d); return d; });
          tip.textContent = L.tips[0];
          setStep(step, true);
        }
        function setStep(n, force) {
          if (n < step && !force) return;
          step = n;
          stageEl.textContent = L.stages[Math.min(n, 4)];
          for (var i = 0; i < stepEls.length; i++) stepEls[i].className = 'step' + (i < n ? ' ok' : i === n ? ' now' : '');
        }
        localize();
        window.__splashLang = localize;

        // Отметки на полоске — там, где кончается каждый шаг.
        var MARKS = [8, 82, 92];
        MARKS.forEach(function (m) { var n = document.createElement('i'); n.className = 'notch'; n.style.left = m + '%'; s.querySelector('.bar').appendChild(n); });

        // Вес: картинка героев 0–8 %, код игры 8–82 %, шрифт и вход 82–92 %, первый кадр — до 100 %.
        var total = 0, got = 0, art = 0, artTotal = 0, done = {};
        FILES.forEach(function (f) { if (f[2]) artTotal += f[1]; else total += f[1]; });
        var target = 2, stepVal = 0;
        function onEntry(e) {
          var path;
          try { path = new URL(e.name, location.href).pathname; } catch (err) { return; }
          for (var i = 0; i < FILES.length; i++) {
            var f = FILES[i];
            if (done[f[0]] || path !== f[0]) continue;
            done[f[0]] = 1;
            if (f[2]) art += f[1]; else got += f[1];
          }
          recompute();
        }
        function recompute() {
          if (!FILES.length) return;
          var a = artTotal ? art / artTotal : 1, c = total ? got / total : 1;
          var t = 8 * a + 74 * c;
          if (c >= 1 && step < 2) setStep(2);
          else if (a >= 1 && step < 1) setStep(1);
          if (stepVal > t) t = stepVal;
          target = Math.max(target, t);
          var all = total + artTotal, big = all >= 1048576;
          var num = function (b) { return big ? (b / 1048576).toFixed(1).replace('.', en ? '.' : ',') : String(Math.round(b / 1024)); };
          sizeEl.textContent = num(got + art) + ' ' + L.of + ' ' + num(all) + ' ' + (big ? L.mb : L.kb);
        }
        window.__splashStep = function (name) {
          if (name === 'fonts') stepVal = Math.max(stepVal, 86);
          if (name === 'platform') { stepVal = Math.max(stepVal, 92); setStep(3); }
          target = Math.max(target, stepVal);
        };
        try {
          if (FILES.length && window.PerformanceObserver) {
            new PerformanceObserver(function (list) { list.getEntries().forEach(onEntry); }).observe({ type: 'resource', buffered: true });
            recompute();
          } else FILES = [];
        } catch (e) { FILES = []; }

        var shown = 0, t0 = Date.now(), k = 0, finished = false;
        function paint() {
          fill.style.width = shown.toFixed(2) + '%';
          spark.style.left = 'calc(3px + (100% - 6px) * ' + (shown / 100).toFixed(4) + ')';
          pctEl.textContent = Math.floor(shown);
          s.setAttribute('aria-valuenow', Math.floor(shown));
        }
        var timer = setInterval(function () {
          // Без списка файлов — мягкое ожидание до 90 %; со списком — чуть подползаем к следующей отметке, чтобы полоска не стояла.
          if (!FILES.length) { target += (90 - target) * 0.05; if (target > 30 && step < 1) setStep(1); }
          else { var cap = target < 8 ? 7 : target < 82 ? 81 : 91; target = Math.min(cap, target + 0.04); }
          shown += (target - shown) * 0.18;
          paint();
          if (++k % 50 === 0) {
            var next = (k / 50) % L.tips.length;
            tip.style.opacity = 0;
            setTimeout(function () { tip.textContent = L.tips[next % L.tips.length]; tip.style.opacity = 1; }, 300);
          }
        }, 60);

        window.__splashDone = function () {
          if (finished) return;
          finished = true;
          clearInterval(timer);
          setStep(4);
          for (var i = 0; i < stepEls.length; i++) stepEls[i].className = 'step ok';
          shown = 100; paint();
          // Если загрузка была мгновенной, даём рассмотреть полную полоску.
          var wait = Math.max(300, 700 - (Date.now() - t0));
          setTimeout(function () { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 550); }, wait);
        };
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Сразу сообщаем Telegram, что страница готова: он убирает свой чёрный экран и показывает заставку.
      try {
        var w = window.Telegram && window.Telegram.WebApp;
        if (w) { w.ready(); w.expand(); w.setHeaderColor && w.setHeaderColor('#0d0f17'); w.setBackgroundColor && w.setBackgroundColor('#0d0f17'); }
        // Язык заставки — теперь и по Telegram.
        window.__splashLang && window.__splashLang();
      } catch (e) {}
      // Не Telegram: может быть Max. Его скрипт (window.WebApp) грузим без блокировки страницы,
      // игра ждёт его не дольше 2,5 секунды (src/telegram.ts, detectPlatform).
      (function () {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) return;
        window.__maxReady = new Promise(function (done) {
          var sc = document.createElement('script');
          sc.src = 'https://st.max.ru/js/max-web-app.js';
          sc.async = true;
          sc.onload = sc.onerror = function () { done(); };
          document.head.appendChild(sc);
          setTimeout(done, 2500);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
