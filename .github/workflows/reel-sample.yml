name: Reel sample (temporary)

# Рилс по кнопке «🎬 Новый рилс» в боте: сервер запускает этот workflow (server/reels.ts),
# Claude пишет сценарий, озвучка нейроголосом Microsoft, титры, монтаж, файл уходит админу в Telegram.
on:
  push:
    branches: [claude/project-thread-by8s0z]
    paths: ['.github/workflows/reel-sample.yml']



jobs:
  reel:
    runs-on: ubuntu-latest
    strategy: { matrix: { n: [1, 3] }, fail-fast: false }
    timeout-minutes: 25
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOICE: ru-RU-SvetlanaNeural
      CHAT: "991020798"
      N: ${{ matrix.n }}
      TOPIC: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          npm i -g @anthropic-ai/claude-code > /dev/null
          # Playwright отдельно от зависимостей проекта: нужен только для рендера титров.
          npm i --prefix $HOME/pw playwright@1.63.0 > /dev/null
          ln -s $HOME/pw/node_modules promo/reels/node_modules
          # Браузер берём готовый с раннера (Google Chrome): установка Chromium с зависимостями занимает 5–10 минут.
          echo "CHROME=$(which google-chrome || which chromium)" >> $GITHUB_ENV
          pip install -q edge-tts imageio-ffmpeg
          mkdir -p $HOME/bin && ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') $HOME/bin/ffmpeg
          echo $HOME/bin >> $GITHUB_PATH
          mkdir -p out
      - name: Script
        working-directory: out
        run: node ../promo/reels/generate.mjs "$N" "$TOPIC"
      - name: Voiceover
        working-directory: out
        run: python3 ../promo/reels/synth.py
      - name: Titles
        working-directory: out
        run: node ../promo/reels/render.mjs
      - name: Build
        working-directory: out
        run: python3 ../promo/reels/build.py
      - uses: actions/upload-artifact@v4
        with: { name: "reel-${{ matrix.n }}", path: "out/reel.mp4\nout/cover.jpg\nout/script.json", retention-days: 7 }
      - name: Send
        working-directory: out
        run: node ../promo/reels/send.mjs "$CHAT"
      - name: Report failure
        if: failure()
        working-directory: out
        run: node ../promo/reels/send.mjs "$CHAT" "ошибка в GitHub Actions (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

