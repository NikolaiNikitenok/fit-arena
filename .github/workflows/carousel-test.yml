name: Carousel test

# Карусель для Instagram по кнопкам «🖼 Карусель: советы / приложение» в боте: сервер запускает этот workflow
# (server/reels.ts), Claude пишет слайды, Playwright рисует картинки 1080×1350, бот присылает их админу.
on:
  push:
    branches: [claude/project-thread-3wuybz]
    paths: ['.github/workflows/carousel-test.yml']



jobs:
  carousel:
    strategy: { matrix: { kind: [tips, app] }, fail-fast: false }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHAT: '991020798'
      N: ${{ matrix.kind == 'tips' && '0' || '1' }}
      KIND: ${{ matrix.kind }}
      TOPIC: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          npm i -g @anthropic-ai/claude-code > /dev/null
          npm i --prefix $HOME/pw playwright@1.63.0 > /dev/null
          ln -s $HOME/pw/node_modules promo/carousel/node_modules
          $HOME/pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          mkdir -p out
      - name: Text
        working-directory: out
        run: node ../promo/carousel/generate.mjs "$N" "$KIND" "$TOPIC"
      - name: Slides
        working-directory: out
        run: node ../promo/carousel/render.mjs
      - uses: actions/upload-artifact@v4
        with: { name: carousel-${{ matrix.kind }}, path: "out/slide_*.jpg\nout/carousel.json", retention-days: 7 }
      - name: Send
        working-directory: out
        run: node ../promo/carousel/send.mjs "$CHAT"
      - name: Report failure
        if: failure()
        working-directory: out
        run: node ../promo/carousel/send.mjs "$CHAT" "ошибка в GitHub Actions (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
