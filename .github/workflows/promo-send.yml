name: Promo to Telegram

# Временный: озвучивает рилс нейроголосом Microsoft, собирает и отправляет владельцу файлом через бота.
on:
  push:
    branches: [claude/project-thread-3wuybz]

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      VOICE: ru-RU-SvetlanaNeural
    defaults:
      run:
        working-directory: promo-send/reel
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          pip install -q imageio-ffmpeg
          mkdir -p $HOME/bin && ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') $HOME/bin/ffmpeg
          echo $HOME/bin >> $GITHUB_PATH
      - name: Voiceover
        run: ./synth_edge.sh
      - name: Build
        run: python3 plan.py && python3 build.py
      - uses: actions/upload-artifact@v4
        with: { name: reel, path: promo-send/reel/reel.mp4 }
      - name: Send
        run: |
          check() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("ok:",r.ok,r.description??"");process.exit(r.ok?0:1)})'; }
          cp reel.mp4 NikitenokArena-reel-02.mp4
          curl -sS -F chat_id=991020798 -F disable_content_type_detection=true \
            -F caption="NikitenokArena, рилс 02 (с хуком): файл в исходном качестве 1080×1920 для Instagram" \
            -F document=@NikitenokArena-reel-02.mp4 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" | check
