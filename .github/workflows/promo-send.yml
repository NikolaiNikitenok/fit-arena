name: Promo to Telegram

# Временный: отправляет промо-ролик владельцу через бота.
on:
  push:
    branches: [claude/project-thread-nom8xy]

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Send video
        run: |
          curl -sS -F chat_id=991020798 -F supports_streaming=true -F width=1080 -F height=1920 -F duration=31 \
            -F caption="Промо-ролик NikitenokArena, 30 секунд" \
            -F video=@promo-send/nikitenok-arena-promo-30s.mp4 \
            "https://api.telegram.org/bot$BOT_TOKEN/sendVideo" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("ok:",r.ok,r.description??"");process.exit(r.ok?0:1)})'
