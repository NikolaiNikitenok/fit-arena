name: Reel

# Рилс по кнопке «🎬 Новый рилс» в боте: сервер запускает этот workflow (server/reels.ts),
# Claude пишет сценарий, озвучка нейроголосом Microsoft, титры, монтаж, файл уходит админу в Telegram.
on:
  workflow_dispatch:
    inputs:
      chat_id: { description: 'Кому прислать (Telegram ID)', required: true }
      n: { description: 'Номер рилса (формула хука по кругу)', required: true, default: '1' }
      topic: { description: 'Тема (необязательно)', required: false, default: '' }
      kind: { description: 'loop — короткий закольцованный рилс (promo/reels/loop), пусто — обычный', required: false, default: '' }
      clip: { description: 'file_id своего видео админа в Telegram для рилса-петли', required: false, default: '' }

concurrency: { group: reel, cancel-in-progress: false }

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOICE: ru-RU-SvetlanaNeural
      CHAT: ${{ inputs.chat_id }}
      N: ${{ inputs.n }}
      TOPIC: ${{ inputs.topic }}
      CLIP: ${{ inputs.clip }}
      # Обычный рилс — скрипты promo/reels, рилс-петля — promo/reels/loop.
      DIR: ${{ inputs.kind == 'loop' && '../promo/reels/loop' || '../promo/reels' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          npm i -g @anthropic-ai/claude-code > /dev/null
          # Playwright отдельно от зависимостей проекта: нужен только для рендера титров.
          npm i --prefix $HOME/pw playwright@1.63.0 > /dev/null
          ln -s $HOME/pw/node_modules promo/reels/node_modules
          # Браузер берём готовый с раннера (Google Chrome): установка Chromium с зависимостями занимает 5–10 минут.
          echo "CHROME=$(which google-chrome || which chromium)" >> $GITHUB_ENV
          pip install -q edge-tts imageio-ffmpeg
          mkdir -p $HOME/bin && ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') $HOME/bin/ffmpeg
          echo $HOME/bin >> $GITHUB_PATH
          mkdir -p out
      - name: Own clip
        if: inputs.kind == 'loop'
        working-directory: out
        run: node ../promo/reels/loop/fetch.mjs
      - name: Script
        working-directory: out
        run: node $DIR/generate.mjs "$N" "$TOPIC"
      - name: Voiceover
        if: inputs.kind != 'loop'
        working-directory: out
        run: python3 ../promo/reels/synth.py
      - name: Titles
        working-directory: out
        run: node $DIR/render.mjs
      - name: Build
        working-directory: out
        run: python3 $DIR/build.py
      - uses: actions/upload-artifact@v4
        with: { name: reel, path: "out/reel.mp4\nout/cover.jpg\nout/script.json", retention-days: 7 }
      - name: Send
        working-directory: out
        run: node $DIR/send.mjs "$CHAT"
      - name: Report failure
        if: failure()
        working-directory: out
        run: node $DIR/send.mjs "$CHAT" "ошибка в GitHub Actions (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
