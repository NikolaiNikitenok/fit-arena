name: Music to Telegram

# Временный: присылает владельцу треки библиотеки рилсов послушать.
on:
  push:
    branches: [claude/project-thread-3wuybz]

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Send tracks
        working-directory: promo/reels/music
        run: |
          for id in energy epic hype light tense funky chill anthem; do
            about=$(node -e "console.log(require('./library.json')['$id'])")
            curl -sS -F chat_id=991020798 -F title="$id" -F performer="NikitenokArena" -F caption="🎵 $id — $about" \
              -F audio=@$id.m4a "https://api.telegram.org/bot$BOT_TOKEN/sendAudio" | grep -q '"ok":true' || { echo "fail $id"; exit 1; }
          done
