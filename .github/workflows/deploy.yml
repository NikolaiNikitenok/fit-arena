name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TG_PROXY: ${{ secrets.TG_PROXY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # История нужна для новостей в канале (server/channel.ts).
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      # Последние изменения для рубрики новостей в канале: «hash|дата|тема», от новых к старым.
      - run: git log -n 80 --no-merges --since="30 days ago" --format='%h|%cI|%s' > dist-server/changelog.txt
      - name: Upload to server
        # Пока секреты не добавлены, сборка проверяется, но никуда не выкладывается.
        if: env.DEPLOY_KEY != ''
        run: |
          install -m 600 /dev/null ~/.ssh_key
          echo "$DEPLOY_KEY" > ~/.ssh_key
          SSH="ssh -i $HOME/.ssh_key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete -e "$SSH" dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/arena/"
          # Сервер матчей: выкладываем и перезапускаем, если он уже настроен на сервере.
          if $SSH "$DEPLOY_USER@$DEPLOY_HOST" test -d /opt/arena-server; then
            rsync -az -e "$SSH" dist-server/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/arena-server/"
            # Токен бота из секрета репозитория: передаём через stdin, чтобы он не попал в команду и логи.
            if [ -n "$BOT_TOKEN" ]; then
              printf '%s' "$BOT_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.bot-token'
            fi
            # Прокси до Telegram (VPN на сервере), например socks5://127.0.0.1:1080.
            if [ -n "$TG_PROXY" ]; then
              printf '%s' "$TG_PROXY" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.tg-proxy'
            fi
            # Ключ Claude API для автопостинга в канал.
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              printf '%s' "$ANTHROPIC_API_KEY" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.anthropic-key'
            fi
            # Или подписка Claude: токен из `claude setup-token`, посты пишет Claude Code на сервере.
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.claude-token'
            fi
            # Токен GitHub (Actions: Read and write): кнопка «🎬 Новый рилс» запускает сборку рилса (reel.yml).
            if [ -n "$GH_ACTIONS_TOKEN" ]; then
              printf '%s' "$GH_ACTIONS_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.gh-token'
            fi
            $SSH "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/bin/systemctl restart arena-server
          fi
