name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TG_PROXY: ${{ secrets.TG_PROXY }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
      YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      ID_BOT_TOKEN: ${{ secrets.ID_BOT_TOKEN }}
      ID_BOT_USERNAME: ${{ secrets.ID_BOT_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          # История нужна для новостей в канале (server/channel.ts).
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:id
      # Последние изменения для рубрики новостей в канале: «hash|дата|тема», от новых к старым.
      - run: git log -n 80 --no-merges --since="30 days ago" --format='%h|%cI|%s' > dist-server/changelog.txt
      - name: Upload to server
        # Пока секреты не добавлены, сборка проверяется, но никуда не выкладывается.
        if: env.DEPLOY_KEY != ''
        run: |
          install -m 600 /dev/null ~/.ssh_key
          echo "$DEPLOY_KEY" > ~/.ssh_key
          SSH="ssh -i $HOME/.ssh_key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete -e "$SSH" dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/arena/"
          # «Свобода» (habit.nikitenok.ru): статический сайт из папки habit/, если сервер настроен (deploy/setup-habit.sh).
          if $SSH "$DEPLOY_USER@$DEPLOY_HOST" test -w /var/www/habit; then
            rsync -az --delete -e "$SSH" habit/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/habit/"
          fi
          # Nikitenok ID (id.nikitenok.ru, папка id/): если сервер настроен (deploy/setup-id.sh). Данные в data/ не трогаем.
          if $SSH "$DEPLOY_USER@$DEPLOY_HOST" test -w /opt/nikitenok-id/data; then
            rsync -az -e "$SSH" dist-id/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/nikitenok-id/"
            # Бот для виджета входа Telegram (BotFather: /setdomain id.nikitenok.ru) и тот же Яндекс, что у Арены.
            # Имя бота по умолчанию — @NikitenokID_Bot (id/server/index.ts), секрет ID_BOT_USERNAME нужен, только если бот сменится.
            if [ -n "$ID_BOT_TOKEN" ]; then
              printf '%s' "$ID_BOT_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/nikitenok-id/data/.tg-bot-token'
            fi
            if [ -n "$ID_BOT_USERNAME" ]; then
              printf '%s' "$ID_BOT_USERNAME" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/nikitenok-id/data/.tg-bot-username'
            fi
            if [ -n "$YANDEX_CLIENT_ID" ] && [ -n "$YANDEX_CLIENT_SECRET" ]; then
              printf '%s' "$YANDEX_CLIENT_ID" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/nikitenok-id/data/.yandex-id'
              printf '%s' "$YANDEX_CLIENT_SECRET" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/nikitenok-id/data/.yandex-secret'
            fi
            $SSH "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/bin/systemctl restart nikitenok-id
          fi
          # Сервер матчей: выкладываем и перезапускаем, если он уже настроен на сервере.
          if $SSH "$DEPLOY_USER@$DEPLOY_HOST" test -d /opt/arena-server; then
            rsync -az -e "$SSH" dist-server/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/arena-server/"
            # Токен бота из секрета репозитория: передаём через stdin, чтобы он не попал в команду и логи.
            if [ -n "$BOT_TOKEN" ]; then
              printf '%s' "$BOT_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.bot-token'
            fi
            # Бот в Max (server/maxBot.ts). Его API подписан корневым сертификатом Минцифры, которого нет в Node:
            # скачиваем его на сервер один раз, сервер доверяет ему только в запросах к Max.
            if [ -n "$MAX_BOT_TOKEN" ]; then
              printf '%s' "$MAX_BOT_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.max-token'
              $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/arena-server && { grep -q "BEGIN CERTIFICATE" russian-trusted-root-ca.pem 2>/dev/null || { curl -fsS --max-time 30 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o ca.tmp && grep -q "BEGIN CERTIFICATE" ca.tmp && mv ca.tmp russian-trusted-root-ca.pem; } || echo "Не скачался сертификат Минцифры для Max"; }'
            fi
            # Вход в браузере через Яндекс ID (server/webAuth.ts): приложение на oauth.yandex.ru.
            if [ -n "$YANDEX_CLIENT_ID" ] && [ -n "$YANDEX_CLIENT_SECRET" ]; then
              printf '%s' "$YANDEX_CLIENT_ID" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.yandex-id'
              printf '%s' "$YANDEX_CLIENT_SECRET" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.yandex-secret'
            fi
            # Прокси до Telegram (VPN на сервере), например socks5://127.0.0.1:1080.
            if [ -n "$TG_PROXY" ]; then
              printf '%s' "$TG_PROXY" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.tg-proxy'
            fi
            # Ключ Claude API для автопостинга в канал.
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              printf '%s' "$ANTHROPIC_API_KEY" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.anthropic-key'
            fi
            # Или подписка Claude: токен из `claude setup-token`, посты пишет Claude Code на сервере.
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.claude-token'
            fi
            # Токен GitHub (Actions: Read and write): кнопка «🎬 Новый рилс» запускает сборку рилса (reel.yml).
            if [ -n "$GH_ACTIONS_TOKEN" ]; then
              printf '%s' "$GH_ACTIONS_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.gh-token'
            fi
            # Токен Threads (Meta): кнопка «🧵 Пост в Threads» публикует пост. Сервер сам продлевает его раз в неделю.
            if [ -n "$THREADS_TOKEN" ]; then
              printf '%s' "$THREADS_TOKEN" | $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; cat > /opt/arena-server/.threads-token'
            fi
            $SSH "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/bin/systemctl restart arena-server
          fi
