name: Talk reel test

# Рилс от персонажа по кнопке «🎭 Рилс от персонажа» в боте (server/reels.ts): Claude пишет сценарий для героев игры,
# у каждого свой тембр голоса, 3D-персонаж говорит с открывающимся ртом (влог или в углу поверх игры), монтаж, файл админу.
on:
  push:
    branches: [claude/project-thread-3wuybz]
    paths: [".github/workflows/talk-test.yml"]

concurrency: { group: talk-test, cancel-in-progress: false }

jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHAT: "991020798"
      N: "0"
      TOPIC: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools
        run: |
          npm i -g @anthropic-ai/claude-code > /dev/null
          # Playwright и three отдельно от зависимостей проекта: нужны только для рендера персонажа и титров.
          npm i --prefix $HOME/pw playwright@1.63.0 three@0.186.1 > /dev/null
          ln -s $HOME/pw/node_modules promo/talk/node_modules
          echo "THREE_MODULES=$HOME/pw/node_modules" >> $GITHUB_ENV
          echo "CHROME=$(which google-chrome || which chromium)" >> $GITHUB_ENV
          pip install -q edge-tts imageio-ffmpeg
          mkdir -p $HOME/bin && ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') $HOME/bin/ffmpeg
          echo $HOME/bin >> $GITHUB_PATH
          mkdir -p out
      - name: Script
        working-directory: out
        run: node ../promo/talk/generate.mjs "$N" "$TOPIC"
      - name: Voices
        working-directory: out
        run: python3 ../promo/talk/synth.py
      - name: Character and titles
        working-directory: out
        run: node ../promo/talk/render.mjs
      - name: Build
        working-directory: out
        run: python3 ../promo/talk/build.py
      - uses: actions/upload-artifact@v4
        with: { name: talk, path: "out/reel.mp4\nout/script.json", retention-days: 7 }
      - name: Send
        working-directory: out
        run: node ../promo/talk/send.mjs "$CHAT"
      - name: Report failure
        if: failure()
        working-directory: out
        run: node ../promo/talk/send.mjs "$CHAT" "ошибка в GitHub Actions (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
